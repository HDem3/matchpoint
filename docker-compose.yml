services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: matchpoint, POSTGRES_PASSWORD: matchpoint, POSTGRES_DB: matchpoint}
    volumes: [matchpoint-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U matchpoint"], interval: 5s, timeout: 5s, retries: 10}
  backend:
    build: ./backend
    environment: {DATABASE_URL: postgresql+psycopg://matchpoint:matchpoint@db:5432/matchpoint}
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
  frontend:
    build: {context: ./frontend, args: {VITE_API_URL: http://localhost:8000}}
    ports: ["3000:80"]
    depends_on: [backend]
volumes: {matchpoint-data: {}}


